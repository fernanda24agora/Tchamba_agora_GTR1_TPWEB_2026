<!DOCTYPE html> <!-- Indique au navigateur que le document utilise la version moderne de HTML --> 
<html lang="fr"> <!-- Ouvre le document HTML et précise que la langue principale de la page est le français -->
<head> <!-- Ouvre la partie head, qui contient les informations techniques de la page -->
   <meta charset="UTF-8"> <!-- Définit l'encodage des caractères pour afficher correctement les accents -->
   <title>Ma première page web</title> <!-- Définit le titre affiché dans l'onglet du navigateur -->
   </head> <!-- Ferme la partie head -->
   <body> <!-- Ouvre la partie visible de la page web -->
       <h1>Bienvenue dans mon premier TP de programmation web</h1>
       <p>Ceci est ma première page web créée avec HTML</p>
   </body>
</html>
